[project]
version = "0.1.0"
name = "ai-customer-support-agent"
description = "AI customer support agent for an e-commerce store with RAG, tool calling, and human approval for sensitive actions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ['src']
testpaths = ['tests']
