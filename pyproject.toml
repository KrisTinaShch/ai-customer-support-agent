[project]
version = "0.1.0"
name = "ai-customer-support-agent"
description = "AI customer support agent for an e-commerce store with RAG, tool calling, and human approval for sensitive actions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.5",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.3.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ['src']
testpaths = ['tests']
